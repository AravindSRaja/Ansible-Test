---
- name: Ubuntu 22.04 CIS Level 1 OpenSCAP Assessment
  hosts: ubuntu
  become: true
  gather_facts: false

  vars:

    # ============================================================
    # Fixed Ubuntu 22.04 CIS Level 1 configuration
    # ============================================================

    cis_profile: "xccdf_org.ssgproject.content_profile_cis_level1_server"

    ssg_dir: "/usr/share/xml/scap/ssg/content"

    datastream: "{{ ssg_dir }}/ssg-ubuntu2204-ds.xml"

    scan_dir: "/var/lib/oscap"

    results_file: "{{ scan_dir }}/cis-l1-results-{{ inventory_hostname }}.xml"

    report_file: "{{ scan_dir }}/cis-l1-report-{{ inventory_hostname }}.html"

    # Semaphore/controller locations
    local_results_dir: "./oscap-results/"

    local_reports_dir: "./oscap-reports/"


  tasks:

    # ============================================================
    # 1. Verify Ubuntu 22.04
    # ============================================================

    - name: Check Ubuntu version
      ansible.builtin.command:
        cmd: grep '^VERSION_ID=' /etc/os-release
      register: ubuntu_version
      changed_when: false


    - name: Verify Ubuntu 22.04
      ansible.builtin.assert:
        that:
          - '"VERSION_ID=\"22.04\"" in ubuntu_version.stdout'
        fail_msg: >-
          This playbook is specifically for Ubuntu 22.04.
          Target does not appear to be Ubuntu 22.04.


    # ============================================================
    # 2. Enable Universe repository
    # ============================================================

    - name: Enable Universe repository
      ansible.builtin.apt_repository:
        repo: "deb http://archive.ubuntu.com/ubuntu jammy universe"
        state: present
        filename: ubuntu-universe


    # ============================================================
    # 3. Update APT cache
    # ============================================================

    - name: Update APT cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600


    # ============================================================
    # 4. Verify OpenSCAP package availability
    # ============================================================

    - name: Check OpenSCAP package availability
      ansible.builtin.command:
        cmd: apt-cache policy openscap-scanner
      register: openscap_package
      changed_when: false


    - name: Display OpenSCAP package information
      ansible.builtin.debug:
        var: openscap_package.stdout_lines


    - name: Verify OpenSCAP package is available
      ansible.builtin.assert:
        that:
          - "'Candidate: (none)' not in openscap_package.stdout"
        fail_msg: >-
          openscap-scanner is not available from the configured
          Ubuntu 22.04 repositories.


    # ============================================================
    # 5. Install OpenSCAP
    # ============================================================

    - name: Install OpenSCAP and required utilities
      ansible.builtin.apt:
        name:
          - openscap-scanner
          - ssg-base
          - ssg-debderived
          - unzip
          - curl
        state: present


    # ============================================================
    # 6. Verify OpenSCAP installation
    # ============================================================

    - name: Check OpenSCAP version
      ansible.builtin.command:
        cmd: oscap --version
      register: oscap_version
      changed_when: false


    - name: Display OpenSCAP version
      ansible.builtin.debug:
        var: oscap_version.stdout_lines


    # ============================================================
    # 7. Verify SSG directory
    # ============================================================

    - name: Check SSG content directory
      ansible.builtin.stat:
        path: "{{ ssg_dir }}"
      register: ssg_directory


    - name: Verify SSG content directory exists
      ansible.builtin.assert:
        that:
          - ssg_directory.stat.exists
          - ssg_directory.stat.isdir
        fail_msg: >-
          SSG content directory was not found:
          {{ ssg_dir }}


    # ============================================================
    # 8. Verify Ubuntu 22.04 datastream
    # ============================================================

    - name: Check Ubuntu 22.04 SSG datastream
      ansible.builtin.stat:
        path: "{{ datastream }}"
      register: datastream_stat


    - name: Display datastream status
      ansible.builtin.debug:
        msg:
          - "Datastream: {{ datastream }}"
          - "Exists: {{ datastream_stat.stat.exists }}"


    - name: Verify Ubuntu 22.04 datastream exists
      ansible.builtin.assert:
        that:
          - datastream_stat.stat.exists
          - datastream_stat.stat.size > 0
        fail_msg: >-
          Ubuntu 22.04 SSG datastream was not found:
          {{ datastream }}


    # ============================================================
    # 9. Verify CIS Level 1 profile
    # ============================================================

    - name: Get SSG datastream information
      ansible.builtin.command:
        cmd: oscap info "{{ datastream }}"
      register: oscap_info
      changed_when: false


    - name: Verify CIS Level 1 profile exists
      ansible.builtin.assert:
        that:
          - cis_profile in oscap_info.stdout
        fail_msg: >-
          CIS Level 1 Server profile was not found in:
          {{ datastream }}


    - name: Display selected CIS profile
      ansible.builtin.debug:
        msg:
          - "OS: Ubuntu 22.04"
          - "Datastream: {{ datastream }}"
          - "Profile: {{ cis_profile }}"


    # ============================================================
    # 10. Create OpenSCAP result directory
    # ============================================================

    - name: Create OpenSCAP scan directory
      ansible.builtin.file:
        path: "{{ scan_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"


    # ============================================================
    # 11. Remove previous results
    # ============================================================

    - name: Remove previous XML result
      ansible.builtin.file:
        path: "{{ results_file }}"
        state: absent


    - name: Remove previous HTML report
      ansible.builtin.file:
        path: "{{ report_file }}"
        state: absent


    # ============================================================
    # 12. Run CIS Level 1 assessment
    # ============================================================

    - name: Run Ubuntu 22.04 CIS Level 1 OpenSCAP assessment
      ansible.builtin.command:
        cmd: >
          oscap xccdf eval
          --profile "{{ cis_profile }}"
          --results "{{ results_file }}"
          --report "{{ report_file }}"
          "{{ datastream }}"
      register: oscap_scan
      changed_when: false

      # OpenSCAP:
      # 0 = scan completed successfully
      # 2 = scan completed with findings
      # Other values = execution/error condition

      failed_when: oscap_scan.rc not in [0, 2]


    # ============================================================
    # 13. Display scan output
    # ============================================================

    - name: Display OpenSCAP scan output
      ansible.builtin.debug:
        var: oscap_scan.stdout_lines


    # ============================================================
    # 14. Display warnings/errors
    # ============================================================

    - name: Display OpenSCAP stderr
      ansible.builtin.debug:
        var: oscap_scan.stderr_lines
      when:
        - oscap_scan.stderr_lines is defined
        - oscap_scan.stderr_lines | length > 0


    # ============================================================
    # 15. Display return code
    # ============================================================

    - name: Display OpenSCAP return code
      ansible.builtin.debug:
        msg: "OpenSCAP return code: {{ oscap_scan.rc }}"


    # ============================================================
    # 16. Verify XML result
    # ============================================================

    - name: Check XML result
      ansible.builtin.stat:
        path: "{{ results_file }}"
      register: results_stat


    # ============================================================
    # 17. Verify HTML report
    # ============================================================

    - name: Check HTML report
      ansible.builtin.stat:
        path: "{{ report_file }}"
      register: report_stat


    # ============================================================
    # 18. Verify reports
    # ============================================================

    - name: Verify OpenSCAP reports were generated
      ansible.builtin.assert:
        that:
          - results_stat.stat.exists
          - report_stat.stat.exists
          - results_stat.stat.size > 0
          - report_stat.stat.size > 0
        fail_msg: >-
          OpenSCAP did not generate the expected XML and HTML reports.


    # ============================================================
    # 19. Display report information
    # ============================================================

    - name: Display generated report information
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "CIS LEVEL 1 SCAN COMPLETED"
          - "=============================================="
          - "Server       : {{ inventory_hostname }}"
          - "OS           : Ubuntu 22.04"
          - "Datastream   : {{ datastream }}"
          - "Profile      : {{ cis_profile }}"
          - "XML Result   : {{ results_file }}"
          - "HTML Report  : {{ report_file }}"
          - "XML Size     : {{ results_stat.stat.size }} bytes"
          - "HTML Size    : {{ report_stat.stat.size }} bytes"
          - "OSCAP RC     : {{ oscap_scan.rc }}"
          - "=============================================="


    # ============================================================
    # 20. Fetch XML results to Semaphore
    # ============================================================

    - name: Fetch XML results to Semaphore
      ansible.builtin.fetch:
        src: "{{ results_file }}"
        dest: "{{ local_results_dir }}"
        flat: true


    # ============================================================
    # 21. Fetch HTML report to Semaphore
    # ============================================================

    - name: Fetch HTML report to Semaphore
      ansible.builtin.fetch:
        src: "{{ report_file }}"
        dest: "{{ local_reports_dir }}"
        flat: true


    # ============================================================
    # 22. Final status
    # ============================================================

    - name: Assessment completed
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "ASSESSMENT COMPLETED"
          - "=============================================="
          - "CIS Level 1 assessment completed on {{ inventory_hostname }}."
          - "HTML report fetched to Semaphore."
          - "XML results fetched to Semaphore."
          - "=============================================="
