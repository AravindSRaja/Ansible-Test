---
- name: Ubuntu 22.04 CIS Level 1 OpenSCAP Assessment
  hosts: ubuntu
  become: true
  gather_facts: false

  vars:

    # ============================================================
    # Fixed Ubuntu 22.04 CIS Level 1 configuration
    # ============================================================

    ssg_version: "0.1.81"

    cis_profile: "xccdf_org.ssgproject.content_profile_cis_level1_server"

    ssg_dir: "/usr/share/xml/scap/ssg/content"

    datastream: "{{ ssg_dir }}/ssg-ubuntu2204-ds.xml"

    scan_dir: "/var/lib/oscap"

    results_file: "{{ scan_dir }}/cis-l1-results-{{ inventory_hostname }}.xml"

    report_file: "{{ scan_dir }}/cis-l1-report-{{ inventory_hostname }}.html"

    ssg_zip: "/tmp/scap-security-guide-{{ ssg_version }}.zip"

    ssg_download_url: >-
      https://github.com/ComplianceAsCode/content/releases/download/v{{ ssg_version }}/scap-security-guide-{{ ssg_version }}.zip

    local_results_dir: "./oscap-results/"

    local_reports_dir: "./oscap-reports/"


  tasks:

    # ============================================================
    # 1. Verify target is Ubuntu 22.04
    # ============================================================

    - name: Check Ubuntu version
      ansible.builtin.command:
        cmd: grep '^VERSION_ID=' /etc/os-release
      register: ubuntu_version
      changed_when: false

    - name: Verify Ubuntu 22.04
      ansible.builtin.assert:
        that:
          - '"VERSION_ID=\"22.04\"" in ubuntu_version.stdout'
        fail_msg: >-
          This playbook is specifically for Ubuntu 22.04.
          Target does not appear to be Ubuntu 22.04.


    # ============================================================
    # 2. Install OpenSCAP and required utilities
    # ============================================================

    - name: Update APT cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install OpenSCAP and utilities
      ansible.builtin.apt:
        name:
          - openscap-scanner
          - unzip
          - curl
        state: present


    # ============================================================
    # 3. Verify OpenSCAP
    # ============================================================

    - name: Check OpenSCAP version
      ansible.builtin.command:
        cmd: oscap --version
      register: oscap_version
      changed_when: false

    - name: Display OpenSCAP version
      ansible.builtin.debug:
        var: oscap_version.stdout_lines


    # ============================================================
    # 4. Create SSG directory
    # ============================================================

    - name: Create SSG content directory
      ansible.builtin.file:
        path: "{{ ssg_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0755"


    # ============================================================
    # 5. Check whether Ubuntu 22.04 datastream exists
    # ============================================================

    - name: Check Ubuntu 22.04 SSG datastream
      ansible.builtin.stat:
        path: "{{ datastream }}"
      register: datastream_stat


    # ============================================================
    # 6. Download upstream SSG content
    # ============================================================

    - name: Download SCAP Security Guide
      ansible.builtin.get_url:
        url: "{{ ssg_download_url }}"
        dest: "{{ ssg_zip }}"
        mode: "0644"
        timeout: 120
      when: not datastream_stat.stat.exists


    # ============================================================
    # 7. Extract Ubuntu 22.04 datastream
    # ============================================================

    - name: Extract Ubuntu 22.04 SSG datastream
      ansible.builtin.command:
        cmd: >
          unzip -j -o
          "{{ ssg_zip }}"
          "*/ssg-ubuntu2204-ds.xml"
          -d "{{ ssg_dir }}"
      when: not datastream_stat.stat.exists


    # ============================================================
    # 8. Verify datastream
    # ============================================================

    - name: Verify Ubuntu 22.04 datastream
      ansible.builtin.stat:
        path: "{{ datastream }}"
      register: datastream_final


    - name: Ensure Ubuntu 22.04 datastream exists
      ansible.builtin.assert:
        that:
          - datastream_final.stat.exists
          - datastream_final.stat.size > 0
        fail_msg: >-
          Ubuntu 22.04 SSG datastream was not found:
          {{ datastream }}


    # ============================================================
    # 9. Display fixed scan configuration
    # ============================================================

    - name: Display scan configuration
      ansible.builtin.debug:
        msg:
          - "OS              : Ubuntu 22.04"
          - "SSG Version     : {{ ssg_version }}"
          - "Datastream      : {{ datastream }}"
          - "CIS Profile     : {{ cis_profile }}"


    # ============================================================
    # 10. Verify CIS Level 1 profile exists
    # ============================================================

    - name: Check CIS Level 1 profile
      ansible.builtin.command:
        cmd: oscap info "{{ datastream }}"
      register: oscap_info
      changed_when: false


    - name: Verify CIS Level 1 profile
      ansible.builtin.assert:
        that:
          - cis_profile in oscap_info.stdout
        fail_msg: >-
          CIS Level 1 Server profile was not found in:
          {{ datastream }}


    # ============================================================
    # 11. Create scan directory
    # ============================================================

    - name: Create OpenSCAP scan directory
      ansible.builtin.file:
        path: "{{ scan_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0700"


    # ============================================================
    # 12. Remove previous reports
    # ============================================================

    - name: Remove previous XML result
      ansible.builtin.file:
        path: "{{ results_file }}"
        state: absent

    - name: Remove previous HTML report
      ansible.builtin.file:
        path: "{{ report_file }}"
        state: absent


    # ============================================================
    # 13. Run CIS Level 1 scan
    # ============================================================

    - name: Run Ubuntu 22.04 CIS Level 1 assessment
      ansible.builtin.command:
        cmd: >
          oscap xccdf eval
          --profile "{{ cis_profile }}"
          --results "{{ results_file }}"
          --report "{{ report_file }}"
          "{{ datastream }}"
      register: oscap_scan
      changed_when: false

      # OpenSCAP:
      # 0 = scan completed without failures
      # 2 = scan completed with findings
      # Other values = execution/error condition

      failed_when: oscap_scan.rc not in [0, 2]


    # ============================================================
    # 14. Display scan output
    # ============================================================

    - name: Display OpenSCAP scan output
      ansible.builtin.debug:
        var: oscap_scan.stdout_lines


    # ============================================================
    # 15. Display OpenSCAP warnings/errors
    # ============================================================

    - name: Display OpenSCAP stderr
      ansible.builtin.debug:
        var: oscap_scan.stderr_lines
      when:
        - oscap_scan.stderr_lines is defined
        - oscap_scan.stderr_lines | length > 0


    # ============================================================
    # 16. Display scan return code
    # ============================================================

    - name: Display OpenSCAP return code
      ansible.builtin.debug:
        msg: "OpenSCAP return code: {{ oscap_scan.rc }}"


    # ============================================================
    # 17. Verify XML result
    # ============================================================

    - name: Check XML result
      ansible.builtin.stat:
        path: "{{ results_file }}"
      register: results_stat


    # ============================================================
    # 18. Verify HTML report
    # ============================================================

    - name: Check HTML report
      ansible.builtin.stat:
        path: "{{ report_file }}"
      register: report_stat


    # ============================================================
    # 19. Validate reports
    # ============================================================

    - name: Verify reports were generated
      ansible.builtin.assert:
        that:
          - results_stat.stat.exists
          - report_stat.stat.exists
          - results_stat.stat.size > 0
          - report_stat.stat.size > 0
        fail_msg: "OpenSCAP did not generate the expected reports."


    # ============================================================
    # 20. Display report information
    # ============================================================

    - name: Display generated report information
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "CIS LEVEL 1 SCAN COMPLETED"
          - "=============================================="
          - "Server       : {{ inventory_hostname }}"
          - "OS           : Ubuntu 22.04"
          - "SSG Version  : {{ ssg_version }}"
          - "Profile      : {{ cis_profile }}"
          - "XML Result   : {{ results_file }}"
          - "HTML Report  : {{ report_file }}"
          - "XML Size     : {{ results_stat.stat.size }} bytes"
          - "HTML Size    : {{ report_stat.stat.size }} bytes"
          - "OSCAP RC     : {{ oscap_scan.rc }}"
          - "=============================================="


    # ============================================================
    # 21. Fetch XML report to Semaphore
    # ============================================================

    - name: Fetch XML results to Semaphore
      ansible.builtin.fetch:
        src: "{{ results_file }}"
        dest: "{{ local_results_dir }}"
        flat: true


    # ============================================================
    # 22. Fetch HTML report to Semaphore
    # ============================================================

    - name: Fetch HTML report to Semaphore
      ansible.builtin.fetch:
        src: "{{ report_file }}"
        dest: "{{ local_reports_dir }}"
        flat: true


    # ============================================================
    # 23. Final status
    # ============================================================

    - name: Assessment completed
      ansible.builtin.debug:
        msg:
          - "CIS Level 1 assessment completed."
          - "HTML report fetched to Semaphore."
          - "XML results fetched to Semaphore."
