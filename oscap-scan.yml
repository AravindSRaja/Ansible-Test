---
- name: Run CIS Level 1 OpenSCAP Assessment
  hosts: ubuntu
  become: true
  gather_facts: true

  vars:
    cis_profile: xccdf_org.ssgproject.content_profile_cis_level1_server

    scan_dir: /var/lib/oscap

    results_file: "{{ scan_dir }}/cis-l1-results-{{ inventory_hostname }}.xml"
    report_file: "{{ scan_dir }}/cis-l1-report-{{ inventory_hostname }}.html"

    local_results_dir: "./oscap-results/"
    local_reports_dir: "./oscap-reports/"

  tasks:

    # ============================================================
    # 1. Display target information
    # ============================================================

    - name: Display target operating system
      ansible.builtin.debug:
        msg:
          - "Hostname: {{ ansible_facts['hostname'] }}"
          - "OS: {{ ansible_facts['distribution'] }}"
          - "Version: {{ ansible_facts['distribution_version'] }}"
          - "Architecture: {{ ansible_facts['architecture'] }}"


    # ============================================================
    # 2. Verify target is Ubuntu
    # ============================================================

    - name: Verify target is Ubuntu
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] == "Ubuntu"
        fail_msg: >-
          This playbook is intended for Ubuntu.
          Detected:
          {{ ansible_facts['distribution'] }}
          {{ ansible_facts['distribution_version'] }}


    # ============================================================
    # 3. Update APT cache
    # ============================================================

    - name: Update APT cache
      ansible.builtin.apt:
        update_cache: true
        cache_valid_time: 3600


    # ============================================================
    # 4. Install OpenSCAP and SCAP Security Guide
    # ============================================================

    - name: Install OpenSCAP and SCAP Security Guide
      ansible.builtin.apt:
        name:
          - openscap-scanner
          - ssg-base
          - ssg-debderived
        state: present


    # ============================================================
    # 5. Verify OpenSCAP installation
    # ============================================================

    - name: Check OpenSCAP version
      ansible.builtin.command:
        cmd: oscap --version
      register: oscap_version
      changed_when: false

    - name: Display OpenSCAP version
      ansible.builtin.debug:
        var: oscap_version.stdout_lines


    # ============================================================
    # 6. Find installed SSG datastreams
    # ============================================================

    - name: Find SSG datastream files
      ansible.builtin.find:
        paths:
          - /usr/share/xml/scap/ssg/content
        patterns:
          - "*.xml"
        file_type: file
      register: ssg_files


    # ============================================================
    # 7. Verify SSG files exist
    # ============================================================

    - name: Verify SSG datastream files exist
      ansible.builtin.assert:
        that:
          - ssg_files.files | length > 0
        fail_msg: >-
          No SCAP Security Guide XML files were found under
          /usr/share/xml/scap/ssg/content/


    # ============================================================
    # 8. Display discovered SSG files
    # ============================================================

    - name: Display discovered SSG files
      ansible.builtin.debug:
        msg: "{{ ssg_files.files | map(attribute='path') | list }}"


    # ============================================================
    # 9. Inspect every SSG datastream
    # ============================================================

    - name: Inspect SSG datastreams
      ansible.builtin.command:
        cmd: oscap info "{{ item.path }}"
      loop: "{{ ssg_files.files }}"
      register: ssg_info
      changed_when: false
      failed_when: false


    # ============================================================
    # 10. Select datastream containing CIS Level 1 profile
    # ============================================================

    - name: Select datastream containing CIS Level 1 profile
      ansible.builtin.set_fact:
        datastream: "{{ item.item.path }}"
      loop: "{{ ssg_info.results }}"
      when:
        - cis_profile in item.stdout


    # ============================================================
    # 11. Verify CIS datastream was found
    # ============================================================

    - name: Verify CIS Level 1 datastream was found
      ansible.builtin.assert:
        that:
          - datastream is defined
          - datastream | length > 0
        fail_msg: >-
          Could not find an installed SSG datastream containing
          the CIS Level 1 profile:
          {{ cis_profile }}


    # ============================================================
    # 12. Display selected datastream
    # ============================================================

    - name: Display selected SSG datastream
      ansible.builtin.debug:
        msg:
          - "Selected datastream: {{ datastream }}"
          - "CIS profile: {{ cis_profile }}"


    # ============================================================
    # 13. Verify CIS profile using oscap info
    # ============================================================

    - name: Verify CIS profile
      ansible.builtin.command:
        cmd: oscap info "{{ datastream }}"
      register: selected_datastream_info
      changed_when: false

    - name: Display available CIS profile information
      ansible.builtin.debug:
        msg: >-
          CIS Level 1 profile found in {{ datastream }}


    # ============================================================
    # 14. Create scan directory
    # ============================================================

    - name: Create OpenSCAP scan directory
      ansible.builtin.file:
        path: "{{ scan_dir }}"
        state: directory
        owner: root
        group: root
        mode: '0700'


    # ============================================================
    # 15. Remove previous scan results
    # ============================================================

    - name: Remove previous XML results
      ansible.builtin.file:
        path: "{{ results_file }}"
        state: absent

    - name: Remove previous HTML report
      ansible.builtin.file:
        path: "{{ report_file }}"
        state: absent


    # ============================================================
    # 16. Run CIS Level 1 OpenSCAP assessment
    # ============================================================

    - name: Run CIS Level 1 OpenSCAP assessment
      ansible.builtin.command:
        cmd: >
          oscap xccdf eval
          --profile {{ cis_profile }}
          --results {{ results_file }}
          --report {{ report_file }}
          {{ datastream }}
      register: oscap_scan
      changed_when: false
      failed_when: oscap_scan.rc not in [0, 2]


    # ============================================================
    # 17. Display scan output
    # ============================================================

    - name: Display OpenSCAP scan output
      ansible.builtin.debug:
        var: oscap_scan.stdout_lines


    # ============================================================
    # 18. Display warnings/errors
    # ============================================================

    - name: Display OpenSCAP stderr
      ansible.builtin.debug:
        var: oscap_scan.stderr_lines
      when:
        - oscap_scan.stderr_lines is defined
        - oscap_scan.stderr_lines | length > 0


    # ============================================================
    # 19. Display scan return code
    # ============================================================

    - name: Display OpenSCAP return code
      ansible.builtin.debug:
        msg: "OpenSCAP return code: {{ oscap_scan.rc }}"


    # ============================================================
    # 20. Verify XML result file
    # ============================================================

    - name: Check XML result file
      ansible.builtin.stat:
        path: "{{ results_file }}"
      register: results_stat


    # ============================================================
    # 21. Verify HTML report
    # ============================================================

    - name: Check HTML report
      ansible.builtin.stat:
        path: "{{ report_file }}"
      register: report_stat


    # ============================================================
    # 22. Verify generated files
    # ============================================================

    - name: Verify OpenSCAP result files
      ansible.builtin.assert:
        that:
          - results_stat.stat.exists
          - report_stat.stat.exists
          - results_stat.stat.size > 0
          - report_stat.stat.size > 0
        fail_msg: >-
          OpenSCAP did not generate valid XML and HTML report files.


    # ============================================================
    # 23. Display report information
    # ============================================================

    - name: Display generated report information
      ansible.builtin.debug:
        msg:
          - "Assessment completed on: {{ inventory_hostname }}"
          - "Datastream: {{ datastream }}"
          - "Profile: {{ cis_profile }}"
          - "XML results: {{ results_file }}"
          - "HTML report: {{ report_file }}"
          - "XML size: {{ results_stat.stat.size }} bytes"
          - "HTML size: {{ report_stat.stat.size }} bytes"


    # ============================================================
    # 24. Fetch XML results to Semaphore
    # ============================================================

    - name: Fetch XML results
      ansible.builtin.fetch:
        src: "{{ results_file }}"
        dest: "{{ local_results_dir }}"
        flat: true


    # ============================================================
    # 25. Fetch HTML report to Semaphore
    # ============================================================

    - name: Fetch HTML report
      ansible.builtin.fetch:
        src: "{{ report_file }}"
        dest: "{{ local_reports_dir }}"
        flat: true


    # ============================================================
    # 26. Final status
    # ============================================================

    - name: Assessment completed
      ansible.builtin.debug:
        msg:
          - "=============================================="
          - "CIS LEVEL 1 ASSESSMENT COMPLETED"
          - "=============================================="
          - "Server       : {{ inventory_hostname }}"
          - "OS           : Ubuntu {{ ansible_facts['distribution_version'] }}"
          - "Profile      : {{ cis_profile }}"
          - "Datastream   : {{ datastream }}"
          - "OSCAP RC     : {{ oscap_scan.rc }}"
          - "XML Result   : {{ results_file }}"
          - "HTML Report  : {{ report_file }}"
          - "=============================================="
