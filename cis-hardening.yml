---
- name: Apply CIS hardening
  hosts: ubuntu_servers
  become: true
  gather_facts: false

  tasks:

    - name: Copy CIS remediation script
      ansible.builtin.copy:
        src: new_bash_remediation.sh
        dest: /tmp/cis-remediation.sh
        mode: '0700'
        owner: root
        group: root

    - name: Execute CIS remediation script
      ansible.builtin.command:
        cmd: /tmp/cis-remediation.sh
      register: remediation_result

    - name: Display remediation output
      ansible.builtin.debug:
        var: remediation_result.stdout_lines

    - name: Display remediation errors
      ansible.builtin.debug:
        var: remediation_result.stderr_lines
      when: remediation_result.stderr_lines | length > 0

    - name: Remove remediation script
      ansible.builtin.file:
        path: /tmp/cis-remediation.sh
        state: absent
